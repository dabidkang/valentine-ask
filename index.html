<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <title>Valentine Letter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Luxurious+Script&display=swap"
      rel="stylesheet"
    />

    <title>Document</title>
  </head>
  <body>
    <!-- Envelope Screen -->
    <div id="envelope-container">
      <img
        src="pngtree-cute-pink-envelope-icon-png-image_6602150.png"
        alt="Envelope"
        id="envelope"
      />
      <p>To Lina</p>
    </div>

    <!-- Letter Screen -->
    <div id="letter-container">
      <div class="letter-window">
        <h1 id="letter-title">Will you be my Valentine?</h1>

        <img src="goma_flowers.gif" class="cat" id="letter-cat" />

        <div class="buttons" id="letter-buttons">
          <p class="btn yes-btn" alt="Yes">Yes</p>

          <div class="no-wrapper">
            <p class="btn no-btn" alt="No">No</p>
          </div>
        </div>

        <p id="final-text" class="final-text" style="display: none">
          On the way to give you treats ☺︎
          <br />I love you ❤︎
        </p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
